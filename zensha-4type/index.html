<h2>前者の４タイプ</h2>
<p>前者のタイプ分けは「<strong>思考</strong>」と「<strong>情報の保存</strong>」を「<strong>どっち</strong>で行っているか」に基づいた分類です。</p>
<p>「どっち」とは：</p>
<ul><li><strong>内＝身体</strong>（及びその延長）</li><li><strong>外＝身体の外</strong></li></ul>
<p>前者には２つの領域が存在：</p>
<ul><li>「<strong>身体」「身体延長的なゾーン</strong>」（PCのハード＋SDやHDD）</li><li>「<strong>身体の外のゾーン</strong>」（クラウド）</li></ul>
